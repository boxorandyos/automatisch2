name: Automatisch Docs Change
on:
  pull_request:
    paths:
      - 'packages/docs/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Label PR
        uses: actions/github-script@v6
        with:
          script: |
            const { pull_request } = context.payload;

            const label = 'documentation-change';
            const hasLabel = pull_request.labels.some(({ name }) => name === label);

            if (hasLabel) {
              console.log(`Label "${label}" already exists on PR #${pull_request.number}`);
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull_request.number,
                labels: [label],
              });

              console.log(`Label "${label}" added to PR #${pull_request.number}`);
            } catch (error) {
              const status = error.status || error.response?.status;
              // Repo token policy may deny label writes (e.g. read-only GITHUB_TOKEN).
              // Do not fail the PR for an optional metadata label.
              if (status === 403 || status === 404) {
                console.warn(
                  `Skipping label "${label}" on PR #${pull_request.number}: ${error.message}`
                );
                return;
              }

              throw error;
            }
